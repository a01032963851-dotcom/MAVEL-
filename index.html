  });
  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 480;
    var l = Math.floor((x - 40) / LANE_W); if (l < 0 || l > 3) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    cv._lane = l; press(l);
  });
  cv.addEventListener('pointerup', function () { if (cv._lane !== undefined) { release(cv._lane); cv._lane = undefined; } });

  function accuracy() { return tally.total ? tally.pts / tally.total : 0; }
  function gradeOf(a) { return a >= 0.92 ? 'S' : a >= 0.8 ? 'A' : a >= 0.65 ? 'B' : a >= 0.45 ? 'C' : 'F'; }

  function finishPart() {
    playing = false;
    var a = accuracy(), g = gradeOf(a);
    grades.push(g); renderProg();
    $('partTitle').textContent = PARTS[curPart].n + ' 완성';
    $('partGrade').textContent = g; $('partGrade').style.color = GCOL[g];
    $('partText').textContent = '정확도 ' + Math.round(a * 100) + '% · 최대 콤보 ' + maxCombo + (g === 'F' ? ' · 결함 부품이 나왔어. 성능이 크게 떨어져.' : '');
    $('nextPartBtn').textContent = curPart >= 4 ? '슈트 완성 확인' : '다음 부품';
    $('partOv').classList.add('show');
  }
  $('nextPartBtn').addEventListener('click', function () {
    $('partOv').classList.remove('show');
    if (curPart >= 4) { showDone(); } else { curPart++; showIntro(); }
  });

  function suitSvg() {
    var c = function (i) { return GCOL[grades[i] || 'F']; };
    return '<rect x="68" y="150" width="26" height="70" rx="8" fill="' + c(2) + '"/><rect x="106" y="150" width="26" height="70" rx="8" fill="' + c(2) + '"/>' +
      '<rect x="62" y="70" width="76" height="86" rx="14" fill="#2b2b36" stroke="#555" stroke-width="2"/>' +
      '<rect x="30" y="74" width="26" height="70" rx="10" fill="' + c(1) + '"/><rect x="144" y="74" width="26" height="70" rx="10" fill="' + c(1) + '"/>' +
      '<circle cx="100" cy="46" r="26" fill="' + c(1) + '"/><rect x="82" y="38" width="36" height="9" rx="3" fill="#fff" opacity=".85"/>' +
      '<circle cx="100" cy="108" r="18" fill="#0b0b10" stroke="' + c(0) + '" stroke-width="5"/><circle cx="100" cy="108" r="8" fill="' + c(0) + '"/>' +
      '<path d="M76 222 L88 238 L100 222 Z M100 222 L112 238 L124 222 Z" fill="' + c(3) + '"/>' +
      '<circle cx="173" cy="152" r="9" fill="' + c(4) + '"/><rect x="170" y="140" width="6" height="12" fill="' + c(4) + '"/>';
  }
  function showDone() {
    var vals = grades.map(function (g) { return GVAL[g]; });
    var sum = vals.reduce(function (a, b) { return a + b; }, 0);
    var overall = sum / 25 >= 0.92 ? 'S' : sum / 25 >= 0.78 ? 'A' : sum / 25 >= 0.6 ? 'B' : sum / 25 >= 0.45 ? 'C' : 'F';
    $('doneTitle').textContent = MARKS[curMark].n + ' 완성! 종합 ' + overall;
    $('suitSvg').innerHTML = suitSvg();
    var st = [
      ['출력', vals[0] * 2 + vals[4]], ['공격', vals[4] * 2 + vals[1]], ['방어', vals[1] + vals[2] * 2], ['기동', vals[2] + vals[3] * 2]
    ];
    var h = '';
    st.forEach(function (s) { var pct = Math.min(100, s[1] / 15 * 100); h += '<div class="stat"><span>' + s[0] + '</span><div class="bar"><i style="width:' + pct + '%"></i></div><b>' + s[1] * 10 + '</b></div>'; });
    $('stats').innerHTML = h;
    var prev = save.clear[curMark];
    if (!prev || GVAL[overall] > GVAL[prev.grade]) { save.clear[curMark] = { grade: overall }; persist(); }
    $('doneOv').classList.add('show');
  }
  $('menuBtn').addEventListener('click', showMenu);
  $('redoBtn').addEventListener('click', function () { startMark(curMark); });

  /* 그리기 */
  var last = 0;
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (playing) update();
    draw(dt);
    RAF(frame);
  }
  function update() {
    var now = gt();
    for (var i = 0; i < chart.notes.length; i++) {
      var n = chart.notes[i];
      if (n.done) continue;
      if (n.type === 'haz') { if (now > n.t + 0.09) judge(n, 'avoid', n.lane); continue; }
      if (n.type === 'hold' && n.holding) {
        if (now >= n.t + n.dur) { n.holding = false; judge(n, n.startKind, n.lane); }
        continue;
      }
      if (now > n.t + 0.14) judge(n, 'miss', n.lane);
    }
    if (now > chart.end) finishPart();
  }
  function noteY(t, now) { return HIT_Y - (t - now) * SPEED; }
  function draw(dt) {
    var now = playing ? gt() : -1;
    ctx.fillStyle = '#0e0e14'; ctx.fillRect(0, 0, 480, 640);
    for (var l = 0; l < 4; l++) {
      ctx.fillStyle = l % 2 ? '#13131b' : '#101018'; ctx.fillRect(LANE_X[l], 0, LANE_W, 640);
      ctx.strokeStyle = '#2a2a35'; ctx.lineWidth = 1; ctx.strokeRect(LANE_X[l], 0, LANE_W, 640);
      if (pressed[l]) { var g = ctx.createLinearGradient(0, HIT_Y - 160, 0, HIT_Y); g.addColorStop(0, 'rgba(216,50,63,0)'); g.addColorStop(1, 'rgba(216,50,63,.45)'); ctx.fillStyle = g; ctx.fillRect(LANE_X[l], HIT_Y - 160, LANE_W, 160); }
    }
    ctx.fillStyle = '#f2c04a'; ctx.fillRect(40, HIT_Y - 2, 400, 4);
    ctx.font = '700 18px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#6b6b78';
    ['D', 'F', 'J', 'K'].forEach(function (k, i) { ctx.fillText(k, LANE_X[i] + LANE_W / 2, HIT_Y + 40); });
    if (playing && chart) {
      chart.notes.forEach(function (n) {
        if (n.done && n.res !== 'holding') return;
        var y = noteY(n.t, now);
        var x = LANE_X[n.lane] + 8, w = LANE_W - 16;
        if (y < -80 && !n.holding) return;
        if (y > 700) return;
        if (n.type === 'hold') {
          var yEnd = noteY(n.t + n.dur, now);
          var yTop = Math.min(y, HIT_Y), yBot = yEnd;
          ctx.fillStyle = n.holding ? '#ffd86b' : '#2b7bd8';
          ctx.fillRect(x + 14, Math.min(yEnd, y), w - 28, Math.abs(y - yEnd));
          ctx.fillStyle = n.holding ? '#fff2c2' : '#52e0ff'; ctx.fillRect(x, Math.min(HIT_Y, y) - 9, w, 18);
        } else if (n.type === 'haz') {
          ctx.fillStyle = '#d8323f'; ctx.beginPath();
          ctx.moveTo(x + w / 2, y - 18); ctx.lineTo(x + w - 6, y); ctx.lineTo(x + w / 2, y + 18); ctx.lineTo(x + 6, y); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '700 20px sans-serif'; ctx.fillText('⚡', x + w / 2, y + 7);
        } else {
          ctx.fillStyle = '#52e0ff'; ctx.fillRect(x, y - 9, w, 18);
          ctx.fillStyle = '#fff'; ctx.fillRect(x + 6, y - 5, w - 12, 4);
        }
      });
      ctx.fillStyle = '#0e0e14'; ctx.fillRect(0, 0, 480, 80);
      ctx.fillStyle = '#f1eee6'; ctx.font = '700 28px "Black Han Sans", sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(score, 16, 36);
      ctx.textAlign = 'right'; ctx.fillStyle = '#f2c04a'; ctx.fillText(combo > 1 ? combo + ' 콤보' : '', 464, 36);
      ctx.textAlign = 'left'; ctx.font = '500 13px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#a8a5b4';
      ctx.fillText(PARTS[curPart].n + ' · ' + MARKS[curMark].n, 16, 58);
      var ratio = Math.max(0, Math.min(1, now / chart.end));
      ctx.fillStyle = '#2a2a35'; ctx.fillRect(16, 68, 448, 4); ctx.fillStyle = '#d8323f'; ctx.fillRect(16, 68, 448 * ratio, 4);
      ctx.textAlign = 'center';
    }
    for (var i = popups.length - 1; i >= 0; i--) {
      var p = popups[i]; p.t += dt;
      if (p.t > 0.5) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - p.t / 0.5; ctx.fillStyle = p.col; ctx.font = '700 18px "Noto Sans KR", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p.txt, p.x, p.y - p.t * 40); ctx.globalAlpha = 1;
    }
  }

  Wn.addEventListener('blur', function () { for (var l = 0; l < 4; l++) release(l); });
  showMenu();
  RAF(frame);

}}
  ];

  var view = document.getElementById('view'), bar = document.getElementById('bar'), ttl = document.getElementById('ttl');
  var sharedAC = null;
  function AC() {
    if (!sharedAC || sharedAC.state === 'closed') sharedAC = new (window.AudioContext || window.webkitAudioContext)();
    return sharedAC;
  }
  var current = null; // { host, tracked, alive }

  /* 진행 기록 저장: 계정에 묶인 개인 저장 공간(db)에 쓰고, 브라우저 저장소에도 함께 복사해 둔다 */
  var KEYS = ['loki-best', 'dp-best-rt', 'web-best', 'stone-best', 'shield-stars', 'suit-save', 'suit-offset'];
  var Store = (function () {
    var cache = {}, ref = null, saving = false, dirty = false, timer = null;
    function lget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function flush() {
      if (!ref || saving || !dirty) return;
      saving = true; dirty = false;
      var kv = {}; Object.keys(cache).forEach(function (k) { kv[k] = cache[k]; });
      ref.set({ kv: kv }).then(function () { saving = false; if (dirty) schedule(); },
        function () { saving = false; });
    }
    function schedule() { dirty = true; clearTimeout(timer); timer = setTimeout(flush, 700); }
    var ready = new Promise(function (resolve) {
      var done = false;
      function fin() { if (!done) { done = true; resolve(); } }
      setTimeout(fin, 3500);
      (async function () {
        try {
          if (!window.claude || !window.claude.use) return;
          var dbm = await window.claude.use('db'), um = await window.claude.use('user');
          if (!dbm || !um) return;
          var id = await um.id();
          if (!id) return;
          var r = dbm.doc('data/users/' + id + '/progress');
          var snap = await r.get();
          var remote = (snap.exists && snap.data() && snap.data().kv) || {};
          var upload = false;
          KEYS.forEach(function (k) {
            if (remote[k] != null) { cache[k] = String(remote[k]); lset(k, cache[k]); }
            else { var lv = lget(k); if (lv != null) { cache[k] = lv; upload = true; } }
          });
          ref = r;
          if (upload) schedule();
        } catch (e) {} finally { fin(); }
      })();
    });
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });
    return {
      ready: ready,
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(cache, k) ? cache[k] : lget(k); },
      setItem: function (k, v) { cache[k] = String(v); lset(k, cache[k]); schedule(); }
    };
  })();
  function lsGet(k) { return Store.getItem(k); }
  function record(id) {
    try {
      if (id === 'loki') { var v = parseInt(lsGet('loki-best') || '0', 10); return v ? '최고 ' + v + '연속' : ''; }
      if (id === 'deadpool') { var r = parseInt(lsGet('dp-best-rt') || '0', 10); return r ? '최고 ' + r + 'ms' : ''; }
      if (id === 'webswing') { var w = parseInt(lsGet('web-best') || '0', 10); return w ? '최고 ' + w + 'm' : ''; }
      if (id === 'stones') { var s = parseInt(lsGet('stone-best') || '0', 10); return s ? '최고 ' + s + '번째 타노스' : ''; }
      if (id === 'shield') { var o = JSON.parse(lsGet('shield-stars') || '{}'), t = 0; for (var k in o) t += o[k]; return t ? '별 ' + t + '개' : ''; }
      if (id === 'suit') { var c = JSON.parse(lsGet('suit-save') || '{}').clear || {}, n = Object.keys(c).length; return n ? '완성 ' + n + '개' : ''; }
    } catch (e) {}
    return '';
  }

  function unmount() {
    if (!current) return;
    current.alive = false;
    current.tracked.forEach(function (t) { window.removeEventListener(t[0], t[1], t[2]); });
    if (current.host.parentNode) current.host.parentNode.removeChild(current.host);
    try { if (sharedAC) { sharedAC.close(); } } catch (e) {}
    sharedAC = null;
    current = null;
  }

  function showHome() {
    unmount();
    bar.setAttribute('data-home', '1'); ttl.textContent = '마블 미니게임 모음집';
    var h = '<div class="home"><div><h1>마블 미니게임<br>모음집</h1></div>' +
      '<p class="lead">1인용 미니게임 6개야. 한 판이 짧으니까 마음 가는 것부터 골라서 해봐.</p><div class="grid">';
    GAMES.forEach(function (g, i) {
      h += '<button class="card" type="button" data-id="' + g.id + '"><span class="no">' + (i + 1) + '번</span><span class="nm">' + g.name + '</span><span class="ds">' + g.desc + '</span><span class="ft"><span class="tag">' + g.tag + '</span><span class="rec">' + record(g.id) + '</span></span></button>';
    });
    h += '</div><div class="foot">최고 기록과 별은 이 브라우저에만 저장돼.</div></div>';
    view.innerHTML = h;
    view.querySelectorAll('.card').forEach(function (b) { b.addEventListener('click', function () { location.hash = b.getAttribute('data-id'); }); });
    window.scrollTo(0, 0);
  }

  function open(id) {
    var g = GAMES.filter(function (x) { return x.id === id; })[0];
    if (!g) { showHome(); return; }
    unmount();
    view.innerHTML = '';
    var host = document.createElement('div');
    var root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>' + g.css + '</style><div class="gbody">' + g.html + '</div>';
    view.appendChild(host);
    bar.setAttribute('data-home', '0'); ttl.textContent = g.name;
    var state = { host: host, tracked: [], alive: true };
    current = state;
    var Wn = {
      addEventListener: function (t, f, o) { state.tracked.push([t, f, o]); window.addEventListener(t, f, o); },
      removeEventListener: function (t, f, o) { window.removeEventListener(t, f, o); }
    };
    var RAF = function (fn) { return requestAnimationFrame(function (ts) { if (state.alive) fn(ts); }); };
    window.scrollTo(0, 0);
    Store.ready.then(function () { if (state.alive) g.init(root, Wn, RAF, AC, Store); });
  }

  function route() {
    var id = (location.hash || '').replace('#', '');
    if (id) open(id); else showHome();
  }
  document.getElementById('backBtn').addEventListener('click', function () { location.hash = ''; if (!location.hash) route(); });
  window.addEventListener('hashchange', route);
  route();
  Store.ready.then(function () { if (!current && !(location.hash || '').replace('#', '')) showHome(); });
})();
</script>
